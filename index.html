<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism — step 3: live audio reactivity</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000}
canvas{display:block}
#ui{
  position:fixed; left:10px; bottom:10px; z-index:10;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  font:12px/1.4 -apple-system,system-ui,sans-serif; color:#eee;
}
#ui button{
  min-height:40px; padding:0 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.45); color:#eee; font-size:13px; -webkit-tap-highlight-color:transparent;
}
#ui button:disabled{opacity:0.4}
#status{
  padding:2px 8px; background:rgba(0,0,0,0.45); border-radius:8px;
  border:1px solid rgba(255,255,255,0.15); white-space:nowrap;
}
</style>
</head>
<body>
<div id="ui">
  <button id="btnMic">Mic</button>
  <button id="btnFile">Load File</button>
  <input type="file" id="fileInput" style="display:none">
  <button id="btnPlay" disabled>Play</button>
  <span id="status">idle</span>
</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: false });
// DPR clamp — critical on iPhone (reports 3, kills perf)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uTime:       { value: 0 },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  // Audio uniforms per §2 — uBass/uTreble/uEnergy now driven live by the
  // Web Audio analyser below; uBeat stays 0 until the onset detector (§8 step 4)
  uBass:   { value: 0 },
  uTreble: { value: 0 },
  uEnergy: { value: 0 },
  uBeat:   { value: 0 },
};

const fragmentShader = /* glsl */`
precision highp float;
uniform float uTime;
uniform vec2  uResolution;
uniform float uBass;
uniform float uTreble;
uniform float uEnergy;
uniform float uBeat;

// ---- Mandelbulb distance estimator with multi-component orbit trap ----
// trap.x: min |z|            (sphere trap  -> base colour ramp)
// trap.y: min |z.y|          (plane trap   -> banding / highlight veins)
// trap.z: min |z.xz|         (axis trap    -> iridescent core glow)
float mandelbulbDE(vec3 pos, out vec3 trap) {
  vec3 z = pos;
  float dr = 1.0;
  float r  = 0.0;
  trap = vec3(1e10);
  // Power breathes 6..10 on bass, per §3's mapping example
  float power = 6.0 + uBass * 4.0;
  for (int i = 0; i < 12; i++) {
    r = length(z);
    trap.x = min(trap.x, r);
    trap.y = min(trap.y, abs(z.y));
    trap.z = min(trap.z, length(z.xz));
    if (r > 2.0) break;
    float theta = acos(z.z / r) * power;
    float phi   = atan(z.y, z.x) * power;
    float zr    = pow(r, power);
    dr = pow(r, power - 1.0) * power * dr + 1.0;
    z = zr * vec3(sin(theta)*cos(phi), sin(theta)*sin(phi), cos(theta)) + pos;
  }
  return 0.5 * log(r) * r / dr;
}

// Distance-only wrapper for normals / shadows / AO (trap unused)
float mapDE(vec3 p) {
  vec3 tr;
  return mandelbulbDE(p, tr);
}

// ---- Sphere tracing ----
float march(vec3 ro, vec3 rd, out vec3 trap, out int steps) {
  float t = 0.0;
  trap = vec3(1e10);
  for (int i = 0; i < 96; i++) {   // step count scales with quality tier later
    steps = i;
    vec3 p = ro + rd * t;
    vec3 tr;
    float d = mandelbulbDE(p, tr);
    trap = min(trap, tr);
    if (d < 0.0012 * t) return t;  // epsilon scales with distance
    if (t > 8.0) break;
    t += d;
  }
  return -1.0;
}

vec3 getNormal(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    mapDE(p + e.xyy) - mapDE(p - e.xyy),
    mapDE(p + e.yxy) - mapDE(p - e.yxy),
    mapDE(p + e.yyx) - mapDE(p - e.yyx)
  ));
}

// ---- Soft shadows: march toward the light, penumbra from closest approach ----
float softShadow(vec3 ro, vec3 rd, float k) {
  float res = 1.0;
  float t = 0.015;
  for (int i = 0; i < 32; i++) {   // shadow steps scale with quality tier later
    float d = mapDE(ro + rd * t);
    res = min(res, k * d / t);
    if (res < 0.005 || t > 3.0) break;
    t += clamp(d, 0.012, 0.25);
  }
  return clamp(res, 0.0, 1.0);
}

// ---- SDF ambient occlusion: sample true distance along the normal ----
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.012 + 0.11 * float(i) / 4.0;
    float d = mapDE(p + n * h);
    occ += (h - d) * sca;
    sca *= 0.8;
  }
  return clamp(1.0 - 1.8 * occ, 0.0, 1.0);
}

// ---- Orbit-trap surface colour (preset palettes replace this ramp later) ----
vec3 trapColour(vec3 trap) {
  // Trap sharpness shimmers on treble later; static base for now
  float sharp = 1.5 + uTreble * 2.0;
  // Base ramp indexed by sphere-trap distance
  vec3 col = 0.5 + 0.5 * cos(6.28318 * (trap.x * sharp + vec3(0.0, 0.33, 0.67)) + uTime * 0.1);
  col *= col;                       // deepen: push ramp away from pastel midtones
  // Plane trap: bright veins where the orbit skimmed the y=0 plane
  float vein = exp(-16.0 * trap.y);
  col = mix(col, vec3(1.0, 0.85, 0.5), 0.6 * vein);
  // Axis trap: cool iridescent glow where the orbit hugged the y axis
  float core = exp(-12.0 * trap.z);
  col = mix(col, vec3(0.4, 0.85, 1.0), 0.45 * core);
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;

  // Slow orbiting camera; the flight path (§5) replaces this later.
  // uEnergy nudges the orbit radius — a cheap stand-in "push" until then.
  float a = uTime * 0.15;
  float camDist = 2.2 - 0.35 * uEnergy;
  vec3 ro = vec3(camDist * sin(a), 0.6 * sin(uTime * 0.1), camDist * cos(a));
  vec3 ta = vec3(0.0);
  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.6 * fw);

  // Background: subtle vertical nebula gradient
  vec3 bg = mix(vec3(0.012, 0.010, 0.025), vec3(0.030, 0.015, 0.045),
                smoothstep(-0.8, 0.9, uv.y));
  vec3 col = bg;

  vec3 trap; int steps;
  float t = march(ro, rd, trap, steps);

  if (t > 0.0) {
    vec3 p = ro + rd * t;
    vec3 n = getNormal(p);

    vec3 lig = normalize(vec3(0.6, 0.8, 0.3));
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float sha = softShadow(p + n * 0.003, lig, 12.0);

    // SDF AO blended with the cheap step-count AO from step 1
    float aoSdf  = calcAO(p, n);
    float aoStep = 1.0 - float(steps) / 96.0;
    float ao = aoSdf * (0.5 + 0.5 * aoStep);

    float sky = clamp(0.5 + 0.5 * n.y, 0.0, 1.0);
    float bou = clamp(0.3 - 0.7 * n.y, 0.0, 1.0);
    vec3  hal = normalize(lig - rd);
    float spe = pow(clamp(dot(n, hal), 0.0, 1.0), 32.0) * dif * sha;
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 4.0);

    vec3 lin = vec3(0.0);
    lin += 1.30 * dif * sha * vec3(1.00, 0.95, 0.85);   // key light, shadowed
    lin += 0.40 * sky * ao  * vec3(0.50, 0.70, 1.00);   // sky fill
    lin += 0.15 * bou * ao  * vec3(0.60, 0.40, 0.30);   // ground bounce
    lin += 0.25 * fre * ao  * vec3(0.80, 0.90, 1.00);   // rim

    col = trapColour(trap) * lin + spe * 0.7 * vec3(1.0, 0.97, 0.9);

    // Distance fog into the background for depth
    col = mix(col, bg, smoothstep(2.5, 7.0, t));
  }

  // Overall energy lifts global brightness (§3: uEnergy -> global brightness)
  col *= 0.85 + 0.6 * uEnergy;

  // simple gamma; ACES tone mapping arrives with the post chain (§4)
  col = pow(col, vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
  fragmentShader,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

// ---- Native Web Audio analysis layer (§2 basics: bass/treble/energy/uTime) ----
// Full spectrum texture, envelope followers and spectral-flux beat detection
// are §8 step 4 — this is deliberately the minimal analyser -> uniforms wire.
const audio = {
  ctx: null,
  analyser: null,
  freqData: null,
  bassRange: [0, 0],
  trebleRange: [0, 0],
  micStream: null,
  micSource: null,
  fileEl: null,
  fileSource: null,
  destConnected: false,
};

function freqToBin(freq, sampleRate, fftSize) {
  const bin = Math.round(freq / (sampleRate / fftSize));
  return Math.max(0, Math.min(bin, fftSize / 2 - 1));
}

function ensureAudioContext() {
  if (audio.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audio.ctx = new Ctx();
  audio.analyser = audio.ctx.createAnalyser();
  audio.analyser.fftSize = 1024;
  audio.analyser.smoothingTimeConstant = 0.75;
  audio.freqData = new Uint8Array(audio.analyser.frequencyBinCount);
  const sr = audio.ctx.sampleRate;
  audio.bassRange   = [freqToBin(20, sr, audio.analyser.fftSize), freqToBin(250, sr, audio.analyser.fftSize)];
  audio.trebleRange = [freqToBin(4000, sr, audio.analyser.fftSize), freqToBin(12000, sr, audio.analyser.fftSize)];
}

function setDestinationConnected(connected) {
  if (connected && !audio.destConnected) {
    audio.analyser.connect(audio.ctx.destination);
    audio.destConnected = true;
  } else if (!connected && audio.destConnected) {
    audio.analyser.disconnect(audio.ctx.destination);
    audio.destConnected = false;
  }
}

function disconnectCurrentSource() {
  if (audio.micSource) { audio.micSource.disconnect(); audio.micSource = null; }
  if (audio.micStream) { audio.micStream.getTracks().forEach(tr => tr.stop()); audio.micStream = null; }
  if (audio.fileSource) { audio.fileSource.disconnect(); audio.fileSource = null; }
}

function bandAverage(data, [lo, hi]) {
  let sum = 0;
  for (let i = lo; i <= hi; i++) sum += data[i];
  return (sum / (hi - lo + 1)) / 255;
}

function updateAudioUniforms() {
  if (!audio.analyser) return;
  audio.analyser.getByteFrequencyData(audio.freqData);
  uniforms.uBass.value   = bandAverage(audio.freqData, audio.bassRange);
  uniforms.uTreble.value = bandAverage(audio.freqData, audio.trebleRange);
  uniforms.uEnergy.value = bandAverage(audio.freqData, [0, audio.freqData.length - 1]);
}

const statusEl = document.getElementById('status');
function setStatus(text) { statusEl.textContent = text; }

const btnMic = document.getElementById('btnMic');
const btnFile = document.getElementById('btnFile');
const btnPlay = document.getElementById('btnPlay');
const fileInput = document.getElementById('fileInput');

// Mic and file both require a user gesture on iOS Safari before the
// AudioContext will run — these handlers ARE that gesture.
btnMic.addEventListener('click', async () => {
  ensureAudioContext();
  await audio.ctx.resume();
  try {
    disconnectCurrentSource();
    setDestinationConnected(false); // never route mic -> speakers (feedback)
    audio.micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audio.micSource = audio.ctx.createMediaStreamSource(audio.micStream);
    audio.micSource.connect(audio.analyser);
    btnPlay.disabled = true;
    setStatus('mic live');
  } catch (err) {
    // Covers permission denial and the iOS mute-switch/no-input case
    setStatus('mic unavailable');
    console.error(err);
  }
});

// No `accept` attribute on the file input by design — on iOS Safari it
// greys out untagged .wav files.
btnFile.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  ensureAudioContext();
  await audio.ctx.resume();
  disconnectCurrentSource();
  if (!audio.fileEl) {
    audio.fileEl = document.createElement('audio');
    audio.fileEl.playsInline = true;
    audio.fileEl.addEventListener('ended', () => { btnPlay.textContent = 'Play'; });
  }
  audio.fileEl.src = URL.createObjectURL(file);
  audio.fileSource = audio.ctx.createMediaElementSource(audio.fileEl);
  audio.fileSource.connect(audio.analyser);
  setDestinationConnected(true);
  audio.fileEl.play();
  btnPlay.disabled = false;
  btnPlay.textContent = 'Pause';
  setStatus(file.name);
});

btnPlay.addEventListener('click', () => {
  if (!audio.fileEl) return;
  if (audio.fileEl.paused) {
    audio.fileEl.play();
    btnPlay.textContent = 'Pause';
  } else {
    audio.fileEl.pause();
    btnPlay.textContent = 'Play';
  }
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  uniforms.uTime.value = clock.getElapsedTime();
  updateAudioUniforms();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
